plugins {
    alias(libs.plugins.android.library)
}
apply from: "../../common.gradle"

android {
    namespace "de.danoeh.antennapod.storage.preferences"

    defaultConfig {
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
        }
        def quote = { String value -> '"' + value.trim().replace("\\", "\\\\").replace('"', '\\"') + '"' }
        buildConfigField "String", "TRANSCRIPTION_SERVER_URL", quote(localProperties.getProperty("transcription.serverUrl", ""))
        buildConfigField "String", "TRANSCRIPTION_API_TOKEN", quote(localProperties.getProperty("transcription.apiToken", ""))
    }

    lint {
        disable "StaticFieldLeak"
    }
}

dependencies {
    implementation project(':model')

    annotationProcessor libs.androidx.annotation
    implementation libs.androidx.fragment
    implementation libs.androidx.preference
}
